spring.application.name=lb5
spring.config.import=optional:file:.env[.properties]

app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-seconds=${JWT_ACCESS_TTL:900}
app.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL:604800}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/theatre}
spring.datasource.username=${DB_USERNAME:theatre_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
